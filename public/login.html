<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Cassian &amp; Associates PMS</title>
<style>
  :root{--navy:#1E3A5F;--navy7:#16304f;--gold:#C8A24B;--bg:#0f2440;--text:#1c2733;--muted:#697586;--border:#e2e8f0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 20% 10%,#27466e,#0f2440 60%);padding:20px}
  .card{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:100%;max-width:410px;overflow:hidden}
  .head{background:linear-gradient(135deg,var(--navy),var(--navy7));color:#fff;padding:30px 32px;text-align:center}
  .logo{width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,var(--gold),#a9842f);color:#13263f;
    font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .head h1{font-size:19px;font-weight:700}.head p{color:#c9d6e6;font-size:12.5px;margin-top:4px;letter-spacing:.4px;text-transform:uppercase}
  .body{padding:28px 32px 32px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;margin-bottom:16px}
  input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,58,95,.1)}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  button:hover{background:var(--navy7)}button:disabled{opacity:.6;cursor:default}
  .err{background:#fbe9e6;color:#b3402f;border:1px solid #f3c9c2;padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:16px;display:none}
  .hint{margin-top:18px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;border-top:1px solid var(--border);padding-top:16px}
  .hint code{background:#f4f6f9;padding:2px 6px;border-radius:5px;color:var(--navy);font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="logo">C&amp;A</div>
      <h1>Cassian &amp; Associates</h1>
      <p>Audit · Tax · Accounting</p>
    </div>
    <div class="body">
      <div class="err" id="err"></div>
      <form id="form">
        <label>Email</label>
        <input type="email" id="email" value="info@cassian.co.tz" autocomplete="username" required>
        <label>Password</label>
        <input type="password" id="password" value="Password123!" autocomplete="current-password" required>
        <button type="submit" id="btn">Sign in</button>
      </form>
      <div class="hint">
        Demo login: <code>info@cassian.co.tz</code> / <code>Password123!</code><br>
        Other roles: emmanuel@, grace@, amani@, neema@, fatma@, david@cassian.co.tz
      </div>
    </div>
  </div>
<script>
  const API='/api/v1';
  if(localStorage.getItem('cassian_token')){ location.href='app.html'; }
  const form=document.getElementById('form'), btn=document.getElementById('btn'), err=document.getElementById('err');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault(); err.style.display='none'; btn.disabled=true; btn.textContent='Signing in…';
    try{
      const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
        body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
      const json=await res.json();
      if(!res.ok) throw new Error((json.error&&json.error.message)||'Login failed');
      localStorage.setItem('cassian_token',json.data.accessToken);
      localStorage.setItem('cassian_user',JSON.stringify(json.data.user));
      location.href='app.html';
    }catch(ex){ err.textContent=ex.message; err.style.display='block'; btn.disabled=false; btn.textContent='Sign in'; }
  });
</script>
</body>
</html>

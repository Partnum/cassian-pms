# ============================================================
#  Render Blueprint — deploys Cassian PMS as a public web service.
#  Render reads this file automatically (New + → Blueprint).
#  The only secret you must paste in the dashboard is DATABASE_URL
#  (your Supabase "Session pooler" connection string).
# ============================================================
services:
  - type: web
    name: cassian-pms
    runtime: node
    plan: free
    # migrate is idempotent; seed:ifempty only seeds on the very first deploy.
    buildCommand: npm install && npm run migrate && npm run seed:ifempty
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: pg
      - key: PGSSL
        value: "true"
      # Paste your Supabase Session-pooler URL here in the Render dashboard
      # (kept secret — never committed to Git).
      - key: DATABASE_URL
        sync: false
      # Strong secrets generated by Render automatically:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Initial admin/staff password used by the first-time seed. Change after launch.
      - key: SEED_PASSWORD
        value: Password123!
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: AI_MODE
        value: mock
      - key: DRIVE_MODE
        value: local
